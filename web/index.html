<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RemedyTrack: Your Personal Health and Dosage Companion">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4FAFE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#163247" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RemedyTrack">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RemedyTrack</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --rt-bg: #F4FAFE;
      --rt-card: #FFFFFF;
      --rt-fg: #24445C;
      --rt-muted: #4E6678;
      --rt-accent: #1E66F5;
      --rt-track: #DDF2FC;
      --rt-border: #C8E6F8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --rt-bg: #163247;
        --rt-card: #1E3E56;
        --rt-fg: #F4FAFE;
        --rt-muted: #C6E5F7;
        --rt-accent: #A7D8F0;
        --rt-track: #264B66;
        --rt-border: #335F7F;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      background-color: var(--rt-bg);
      color: var(--rt-fg);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #rt-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      background-color: var(--rt-bg);
      color: var(--rt-fg);
      text-align: center;
      transition: opacity 220ms ease-out;
    }

    #rt-boot-loader.rt-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .rt-logo-wrap {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background-color: #163247;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(22, 50, 71, 0.22);
      margin-bottom: 20px;
    }

    .rt-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin: 0 0 6px;
    }

    .rt-status {
      font-size: 14px;
      line-height: 1.45;
      color: var(--rt-muted);
      max-width: 320px;
      margin: 0 0 20px;
    }

    .rt-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid var(--rt-track);
      border-top-color: var(--rt-accent);
      animation: rt-spin 0.85s linear infinite;
    }

    @keyframes rt-spin {
      to { transform: rotate(360deg); }
    }

    #rt-boot-actions {
      display: none;
      margin-top: 20px;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #rt-boot-actions.rt-visible {
      display: flex;
    }

    .rt-btn {
      appearance: none;
      border: 1px solid var(--rt-border);
      background-color: var(--rt-card);
      color: var(--rt-fg);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
    }

    .rt-btn-primary {
      background-color: var(--rt-accent);
      border-color: var(--rt-accent);
      color: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      .rt-btn-primary {
        color: #163247;
      }
    }
  </style>
  <script>
    // Ensure stale service workers from earlier builds are cleared so browsers always load latest bundle
    (function() {
      var buildVersion = 'rt_web_v6';
      function clearSwAndCaches() {
        var cleanupTasks = [];
        var hadController = ('serviceWorker' in navigator && !!navigator.serviceWorker.controller);
        if ('serviceWorker' in navigator) {
          cleanupTasks.push(
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              return Promise.all(registrations.map(function(r) { return r.unregister(); }));
            })
          );
        }
        if ('caches' in window) {
          cleanupTasks.push(
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            })
          );
        }
        return Promise.all(cleanupTasks).then(function() {
          return hadController;
        });
      }

      window.__rtClearCacheAndReload = function() {
        try {
          if (window.localStorage) localStorage.removeItem('rt_sw_version');
          if (window.sessionStorage) sessionStorage.removeItem('rt_sw_reloaded_' + buildVersion);
        } catch (e) {}
        clearSwAndCaches().catch(function() {}).then(function() {
          window.location.reload();
        });
      };

      try {
        var needsReset = window.localStorage && localStorage.getItem('rt_sw_version') !== buildVersion;
        if (needsReset || ('serviceWorker' in navigator && navigator.serviceWorker.controller)) {
          if (window.localStorage) localStorage.setItem('rt_sw_version', buildVersion);
          clearSwAndCaches().then(function(hadController) {
            if (hadController && window.sessionStorage && !sessionStorage.getItem('rt_sw_reloaded_' + buildVersion)) {
              sessionStorage.setItem('rt_sw_reloaded_' + buildVersion, '1');
              window.location.reload();
            }
          }).catch(function() {});
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="rt-boot-loader" role="status" aria-live="polite">
    <div class="rt-logo-wrap" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(-35 24 24)">
          <rect x="8" y="16" width="32" height="16" rx="8" fill="#F4FAFE" stroke="#A7D8F0" stroke-width="2.5"/>
          <path d="M24 16H32C36.4183 16 40 19.5817 40 24C40 28.4183 36.4183 32 32 32H24V16Z" fill="#6BB6E3"/>
        </g>
        <path d="M25 27.5L29.5 32L38 23.5" stroke="#163247" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="rt-title">RemedyTrack</h1>
    <p id="rt-boot-status" class="rt-status">Preparing your medication companion...</p>
    <div id="rt-boot-spinner" class="rt-spinner"></div>
    <div id="rt-boot-actions">
      <button type="button" class="rt-btn rt-btn-primary" onclick="window.location.reload()">Reload App</button>
      <button type="button" class="rt-btn" onclick="window.__rtClearCacheAndReload && window.__rtClearCacheAndReload()">Reset Cache</button>
    </div>
  </div>

  <script>
    (function() {
      var booted = false;
      var watchdog = setTimeout(function() {
        if (booted) return;
        var statusEl = document.getElementById('rt-boot-status');
        var actionsEl = document.getElementById('rt-boot-actions');
        if (statusEl) {
          statusEl.textContent = 'Still loading on this connection. You can keep waiting or tap Reload App.';
        }
        if (actionsEl) {
          actionsEl.classList.add('rt-visible');
        }
      }, 20000);

      window.__rtSetBootStatus = function(text) {
        if (booted) return;
        var statusEl = document.getElementById('rt-boot-status');
        if (statusEl && text) {
          statusEl.textContent = text;
        }
      };

      window.__rtShowBootError = function(message) {
        if (booted) return;
        clearTimeout(watchdog);
        var statusEl = document.getElementById('rt-boot-status');
        var spinnerEl = document.getElementById('rt-boot-spinner');
        var actionsEl = document.getElementById('rt-boot-actions');
        if (spinnerEl) {
          spinnerEl.style.display = 'none';
        }
        if (statusEl) {
          statusEl.textContent = 'Unable to finish loading (' + message + '). Tap Reload App or Reset Cache.';
        }
        if (actionsEl) {
          actionsEl.classList.add('rt-visible');
        }
      };

      function onBootErrorEvent(event) {
        if (booted) return;
        var msg = (event && (event.message || (event.reason && (event.reason.message || String(event.reason))))) || '';
        if (msg && msg.indexOf('ResizeObserver') === -1) {
          window.__rtShowBootError(msg);
        }
      }

      window.addEventListener('error', onBootErrorEvent);
      window.addEventListener('unhandledrejection', onBootErrorEvent);

      window.addEventListener('flutter-first-frame', function() {
        booted = true;
        clearTimeout(watchdog);
        window.removeEventListener('error', onBootErrorEvent);
        window.removeEventListener('unhandledrejection', onBootErrorEvent);
        var loaderEl = document.getElementById('rt-boot-loader');
        if (loaderEl) {
          loaderEl.classList.add('rt-hidden');
          setTimeout(function() {
            if (loaderEl && loaderEl.parentNode) {
              loaderEl.parentNode.removeChild(loaderEl);
            }
          }, 260);
        }
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async onerror="window.__rtShowBootError && window.__rtShowBootError('Failed to load flutter_bootstrap.js')"></script>
</body>
</html>
